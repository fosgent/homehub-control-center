[package]
name = "homehub-client"
version = "0.1.0"
description = "HomeHub Control Center native Windows client (Tauri 2 native layer)."
edition = "2021"
rust-version = "1.80"

[lib]
name = "homehub_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
